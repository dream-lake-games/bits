[package]
name = "bits"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
bevy = "0.17.3"
lightyear = "0.25.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
